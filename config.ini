[querys]
# Schema & Information Schema Queries
check_table_exists = SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = %s
check_columns = SELECT column_name FROM information_schema.columns WHERE table_name = %s
check_column_exists = SELECT 1 FROM information_schema.columns WHERE table_name = %s AND column_name = %s
check_pk_constraint = SELECT conname FROM pg_constraint WHERE conrelid = to_regclass(%s) AND contype = 'p'
create_table_template = CREATE TABLE IF NOT EXISTS {table_name} ({columns_str}, PRIMARY KEY ({pks}));
alter_add_statementtype = ALTER TABLE {table_name} ADD COLUMN IF NOT EXISTS statementtype text DEFAULT '';
alter_add_modifieddatetime = ALTER TABLE {table_name} ADD COLUMN IF NOT EXISTS modifieddatetime timestamp;

# Generic Data Operation Queries
delete_from_table = DELETE FROM {table_name} WHERE {where_clause}
select_from_table = SELECT * FROM {table_name} WHERE {where_clause}
update_table = UPDATE {table_name} SET {set_clause} WHERE {where_clause}
insert_into_table = INSERT INTO {table_name} ({cols}) VALUES %s {conflict_clause}
insert_into_table_returning = INSERT INTO {table_name} ({cols}) VALUES %s {conflict_clause} RETURNING xmax
on_conflict_conditional_update = ON CONFLICT ON CONSTRAINT {constraint_name} DO UPDATE SET {set_clause} WHERE {table_name}.checksum IS DISTINCT FROM EXCLUDED.checksum
on_conflict_update = ON CONFLICT ON CONSTRAINT {constraint_name} DO UPDATE SET {set_clause}
on_conflict_do_nothing = ON CONFLICT ON CONSTRAINT {constraint_name} DO NOTHING

# Master Object Sequencing (Auto ID generator)
upsert_master_object_sequence = INSERT INTO masterobjectsequencing (pk, sk, last_updated_id, last_updated_on) VALUES (%s, %s, %s, %s) ON CONFLICT (pk, sk) DO UPDATE SET last_updated_id = masterobjectsequencing.last_updated_id + %s, last_updated_on = EXCLUDED.last_updated_on RETURNING CASE WHEN last_updated_id = %s THEN 0 ELSE last_updated_id - %s END AS previous_last_updated_id;

# Transaction Log Queries
update_transaction_log = UPDATE transaction_log SET {set_clause} WHERE orgid = %s AND transactionid = %s

# Theme & Process Catalog Queries
fetch_theme_data = SELECT * FROM theme_mapping WHERE productcode = %s AND processcode = %s AND themename = %s
fetch_process_defn = SELECT * FROM public."process" WHERE process_cd <> 'process_cd' AND process_cd = '%s'
check_process_exists = SELECT 1 FROM process WHERE UPPER(process_cd) = '{process_cd}' LIMIT 1
fetch_process_catalog = SELECT * FROM process WHERE UPPER(process_cd) = '{process_cd}'
fetch_process_knowledge = select * from processcodes_knowledge
fetch_distinct_process_cds = SELECT DISTINCT process_cd FROM process ORDER BY process_cd
fetch_distinct_themenames = SELECT DISTINCT themename FROM theme_mapping WHERE UPPER(processcode) = '{process_code}' ORDER BY themename
fetch_distinct_short_texts = SELECT DISTINCT short_text, data_type FROM process WHERE UPPER(process_cd) = '{process_code}' ORDER BY short_text

# Financial Statement (FS) Queries
check_fs_statementtype = SELECT 1 FROM process WHERE UPPER(process_cd) = 'FS' AND UPPER(short_text) = 'STATEMENTTYPE';
insert_fs_statementtype = INSERT INTO process (product_cd, process_cd, process_name, short_text, domain, name, label, data_type, default_value, lde, indexing, mandatory, derive_formula, predefined_list, acronym, process_knowledge, created_by, modified_by, created_time, inprd_time) VALUES ('DTFOWS', 'FS', 'Balance Sheet Reporting', 'StatementType', 'StatementType', 'FS_StatementType', 'FS_StatementType', 'VARCHAR', '', 0, 0, null, null, null, 'FS_StatementType', 'Indicates the type of financial statement (Balance Sheet, Profit and Loss, Notes to Accounts)', 'AI', 'AI', NOW(), NOW())
update_fs_historical_pnl = UPDATE active_fs SET statementtype = 'Profit and Loss' WHERE (statementtype IS NULL OR statementtype = '') AND input LIKE '%Profit_and_Loss%'
update_fs_historical_notes = UPDATE active_fs SET statementtype = 'Notes to Accounts' WHERE (statementtype IS NULL OR statementtype = '') AND input LIKE '%Notes_to_Accounts%'

# Tax System (TAXSYS) Queries
check_taxsys_statementtype = SELECT 1 FROM process WHERE UPPER(process_cd) = 'TAXSYS' AND UPPER(short_text) = 'STATEMENTTYPE';
insert_taxsys_statementtype = INSERT INTO process (product_cd, process_cd, process_name, short_text, domain, name, label, data_type, default_value, lde, indexing, mandatory, derive_formula, predefined_list, acronym, process_knowledge, created_by, modified_by, created_time, inprd_time) VALUES ('DTFOWS', 'TAXSYS', 'Tax Systems Reporting', 'StatementType', 'StatementType', 'TAXSYS_StatementType', 'TAXSYS_StatementType', 'VARCHAR', '', 0, 0, null, null, null, 'TAXSYS_StatementType', 'Indicates the type of tax return or statement (GSTR1, GSTR2B, GSTR3B, etc.)', 'AI', 'AI', NOW(), NOW())
update_taxsys_historical_gstr1 = UPDATE active_taxsys SET statementtype = 'GSTR1' WHERE (statementtype IS NULL OR statementtype = '') AND (input LIKE '%GSTR1%' OR input LIKE '%gstr1%' OR themename LIKE '%GSTR%')

# Super Admin Correction Query
fetch_superadmin_old_records = SELECT * FROM active_{process_code} WHERE themename = '{themename}' AND transactiontype = '{transactiontype}' AND transactionid = '{transactionid}'

# Reverse Column Mapping & Local Export Queries
target_to_source = SELECT themename, targetfieldname, sourcefieldname FROM theme_mapping WHERE UPPER(processcode) = UPPER('{process_code}') AND sourcefieldname IS NOT NULL
user_data = SELECT * FROM {table_name} WHERE tenant_id = '{tenant_id}' AND (transactionid LIKE '{transaction_id}%%' OR input = '{data_key}')
user_data_all = SELECT * FROM {table_name} WHERE tenant_id = '{tenant_id}'

